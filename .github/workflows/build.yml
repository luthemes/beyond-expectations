name: build

on:
    push:
        branches: [ develop ]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '7.4'

            - name: Lint PHP
              run: find app public functions.php index.php -name '*.php' -print0 | xargs -0 -n1 php -l

            - name: Install Node dependencies
              run: if [ -f package-lock.json ]; then npm ci --no-fund; else npm install --no-fund; fi

            # Builds the styles and scripts with Vite and checks every entry is in the manifest.
            - name: Build
              run: npm run prod

            - name: Check the manifest
              run: |
                  for entry in resources/scss/screen.scss resources/js/navigation.js resources/js/hide-search.js; do
                      grep -q "\"$entry\"" public/assets/manifest.json || { echo "::error::$entry is missing from the manifest."; exit 1; }
                  done
