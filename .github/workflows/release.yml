name: release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # PHP + wp-cli are only needed for the Generate POT step below;
            # the release itself is built with Node (Vite).
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '7.4'
                  tools: wp-cli

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            # The release tag (without a leading "v") must match the `Version:` header in
            # style.css, and the zip is named "{repo}.{version}.zip", e.g. beyond-expectations.0.0.1.zip.
            - name: Resolve version
              id: version
              run: |
                  TAG="${{ github.event.release.tag_name }}"
                  VERSION="${TAG#v}"
                  THEME_VERSION=$(sed -n 's/^[ *]*Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' style.css | head -n 1)

                  if [ "$VERSION" != "$THEME_VERSION" ]; then
                      echo "::error::Release tag ($TAG) does not match the style.css version ($THEME_VERSION)."
                      exit 1
                  fi

                  echo "zip=${{ github.event.repository.name }}.$VERSION.zip" >> "$GITHUB_OUTPUT"

            - name: Install Composer dependencies
              run: composer install --no-dev --no-interaction --prefer-dist

            # Regenerate the translation template so the zip always ships a
            # fresh .pot, including the framework's strings (the make-pot
            # script uses --ignore-domain for exactly that reason). Runs
            # after composer install so vendor/backdrop-dev is present to
            # scan, and before Build so the export picks the file up. This
            # does NOT commit the regenerated .pot back to the repo — the
            # committed file stays the source of truth for translators.
            - name: Generate POT
              run: composer make-pot

            # Uses package-lock.json when the repository has one.
            - name: Install Node dependencies
              run: if [ -f package-lock.json ]; then npm ci --no-fund; else npm install --no-fund; fi

            # Don't publish a release built with build tools that have a known high or critical
            # vulnerability.
            - name: Audit Node dependencies
              run: npm audit --audit-level=high

            # Builds the assets with Vite, then exports the theme into the `beyond-expectations` folder.
            - name: Build
              run: npm run build

            - name: Create ZIP
              run: zip -r "${{ steps.version.outputs.zip }}" "${{ github.event.repository.name }}"

            - name: Upload ZIP to GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                    "${{ steps.version.outputs.zip }}" \
                    --clobber
